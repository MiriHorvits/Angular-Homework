<div class="login-container" dir="rtl">
  <h2>התחברות</h2>

  <label for="idNumber">מספר זהות</label>
  <input
    id="idNumber"
    type="text"
    inputmode="numeric"
    autocomplete="off"
    [(ngModel)]="idNumber"
    placeholder="הזן מספר זהות"
  />

  <button type="button" (click)="onLogin()">כניסה</button>
</div>
